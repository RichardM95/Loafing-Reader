[package]
name = "thief-reader"
version = "0.1.0"
edition = "2024"
license = "MIT"
[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:slint-build", "dep:rfd"]
[dependencies]
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
blake3 = "1"
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "accessibility"] }
rfd = { version = "0.15", optional = true }
windows-numerics = "0.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Storage_FileSystem"] }
[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }
[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "thief-reader"
path = "src/main.rs"
required-features = ["desktop"]

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-skia"] }
png = "=0.18.1"
